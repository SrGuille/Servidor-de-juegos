<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Selector de juegos</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Advent+Pro:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
  <script src="{% static 'js/game_redirects.js' %}"></script>
</head>

<body class="page-games">
  <main class="games" aria-label="Selector de juegos">
    <header class="games-header">
      <h1 class="games-title">Juegos</h1>
      <p class="games-subtitle">Pasa por encima para elegir rondas. Click para seleccionar juego.</p>
    </header>

    <section class="games-grid" aria-label="Lista de juegos">
      <!-- RANDOM -->
      <article class="game-card game-card--random">
        <button class="game-select" type="button" onclick="set_random_game()" aria-label="Seleccionar juego aleatorio">
          <div class="game-media">
            <img src="{% static 'img/hat-loader.gif' %}" alt="Aleatorio" loading="lazy">
          </div>
          <div class="game-name">Aleatorio</div>
        </button>

        <!-- Bocadillo rondas -->
        <div class="rounds-bubble" aria-label="Rondas para aleatorio">
          <div class="rounds-bubble-title">Rondas</div>
          <div class="rounds-stepper" role="group" aria-label="Rondas aleatorio">
            <button class="rounds-btn" type="button" data-target="rounds_random" data-delta="-1" aria-label="Restar ronda">−</button>
            <input class="rounds-input" type="number" id="rounds_random" name="rounds_random" value="1" min="1" max="99" inputmode="numeric">
            <button class="rounds-btn" type="button" data-target="rounds_random" data-delta="1" aria-label="Sumar ronda">+</button>
          </div>
        </div>
      </article>

      <!-- GAME 0 -->
      <article class="game-card" data-game-id="0">
        <button class="game-select" type="button" onclick="set_next_game(0)" aria-label="Seleccionar Ruleta">
          <div class="game-media">
            <img src="{% static 'img/hat-loader.gif' %}" alt="Ruleta" loading="lazy">
          </div>
          <div class="game-name">Ruleta</div>
        </button>

        <div class="rounds-bubble" aria-label="Rondas Ruleta">
          <div class="rounds-bubble-title">Rondas</div>
          <div class="rounds-stepper" role="group" aria-label="Rondas Ruleta">
            <button class="rounds-btn" type="button" data-target="rounds0" data-delta="-1" aria-label="Restar ronda">−</button>
            <input class="rounds-input" type="number" id="rounds0" name="rounds0" value="1" min="1" max="99" inputmode="numeric">
            <button class="rounds-btn" type="button" data-target="rounds0" data-delta="1" aria-label="Sumar ronda">+</button>
          </div>
        </div>
      </article>

      <!-- GAME 1 -->
      <article class="game-card" data-game-id="1">
        <button class="game-select" type="button" onclick="set_next_game(1)" aria-label="Seleccionar Ahorcado">
          <div class="game-media">
            <img src="{% static 'img/hat-loader.gif' %}" alt="Ahorcado" loading="lazy">
          </div>
          <div class="game-name">Ahorcado</div>
        </button>

        <div class="rounds-bubble" aria-label="Rondas Ahorcado">
          <div class="rounds-bubble-title">Rondas</div>
          <div class="rounds-stepper" role="group" aria-label="Rondas Ahorcado">
            <button class="rounds-btn" type="button" data-target="rounds1" data-delta="-1" aria-label="Restar ronda">−</button>
            <input class="rounds-input" type="number" id="rounds1" name="rounds1" value="1" min="1" max="99" inputmode="numeric">
            <button class="rounds-btn" type="button" data-target="rounds1" data-delta="1" aria-label="Sumar ronda">+</button>
          </div>
        </div>
      </article>

      <!-- GAME 2 -->
      <article class="game-card" data-game-id="2">
        <button class="game-select" type="button" onclick="set_next_game(2)" aria-label="Seleccionar Democracia">
          <div class="game-media">
            <img src="{% static 'img/hat-loader.gif' %}" alt="Democracia" loading="lazy">
          </div>
          <div class="game-name">Democracia</div>
        </button>

        <div class="rounds-bubble" aria-label="Rondas Democracia">
          <div class="rounds-bubble-title">Rondas</div>
          <div class="rounds-stepper" role="group" aria-label="Rondas Democracia">
            <button class="rounds-btn" type="button" data-target="rounds2" data-delta="-1" aria-label="Restar ronda">−</button>
            <input class="rounds-input" type="number" id="rounds2" name="rounds2" value="1" min="1" max="99" inputmode="numeric">
            <button class="rounds-btn" type="button" data-target="rounds2" data-delta="1" aria-label="Sumar ronda">+</button>
          </div>
        </div>
      </article>

      <!-- GAME 3 -->
      <article class="game-card" data-game-id="3">
        <button class="game-select" type="button" onclick="set_next_game(3)" aria-label="Seleccionar Pistolero">
          <div class="game-media">
            <img src="{% static 'img/hat-loader.gif' %}" alt="Pistolero" loading="lazy">
          </div>
          <div class="game-name">Pistolero</div>
        </button>

        <div class="rounds-bubble" aria-label="Rondas Pistolero">
          <div class="rounds-bubble-title">Rondas</div>
          <div class="rounds-stepper" role="group" aria-label="Rondas Pistolero">
            <button class="rounds-btn" type="button" data-target="rounds3" data-delta="-1" aria-label="Restar ronda">−</button>
            <input class="rounds-input" type="number" id="rounds3" name="rounds3" value="1" min="1" max="99" inputmode="numeric">
            <button class="rounds-btn" type="button" data-target="rounds3" data-delta="1" aria-label="Sumar ronda">+</button>
          </div>
        </div>
      </article>

      <!-- GAME 4 -->
      <article class="game-card" data-game-id="4">
        <button class="game-select" type="button" onclick="set_next_game(4)" aria-label="Seleccionar Números ciegos">
          <div class="game-media">
            <img src="{% static 'img/hat-loader.gif' %}" alt="Números ciegos" loading="lazy">
          </div>
          <div class="game-name">Números ciegos</div>
        </button>

        <div class="rounds-bubble" aria-label="Rondas Números ciegos">
          <div class="rounds-bubble-title">Rondas</div>
          <div class="rounds-stepper" role="group" aria-label="Rondas Números ciegos">
            <button class="rounds-btn" type="button" data-target="rounds4" data-delta="-1" aria-label="Restar ronda">−</button>
            <input class="rounds-input" type="number" id="rounds4" name="rounds4" value="1" min="1" max="99" inputmode="numeric">
            <button class="rounds-btn" type="button" data-target="rounds4" data-delta="1" aria-label="Sumar ronda">+</button>
          </div>
        </div>
      </article>
    </section>

    <footer class="games-footer" aria-label="Edición">
      <span class="games-edition">Edición 2k25 </span>
      <img src="{% static 'img/hat-loader.gif' %}" alt="hatty" loading="lazy" width="48px">
    </footer>
  </main>

  <!-- Snow animation -->
  <div class="tpl-snow" aria-hidden="true">
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
  </div>
  <script>
    function set_random_game() {
  const ids = Array.from(document.querySelectorAll(".game-card[data-game-id]"))
    .map(el => Number(el.dataset.gameId))
    .filter(n => Number.isFinite(n));

  if (!ids.length) return;

  const randomId = ids[Math.floor(Math.random() * ids.length)];

  const rnd = document.getElementById("rounds_random");
  const roundsValue = rnd && rnd.value ? rnd.value : "1";
  const targetRounds = document.getElementById("rounds" + randomId);
  if (targetRounds) targetRounds.value = roundsValue;

  set_next_game(randomId);
}

document.addEventListener("click", (e) => {
  const btn = e.target.closest(".rounds-btn");
  if (!btn) return;

  const id = btn.dataset.target;
  const delta = parseInt(btn.dataset.delta, 10);
  const input = document.getElementById(id);
  if (!input) return;

  const min = Number(input.min || 1);
  const max = Number(input.max || 99);
  const current = Number(input.value || min);
  const next = Math.max(min, Math.min(max, current + delta));

  input.value = String(next);
});

  </script>
</body>
</html>
