<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pantalla de espera</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Advent+Pro:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <script src="{% static 'js/game_redirects.js' %}"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
</head>

<body class="page-login page-wait">
  <nav class="util-bar" aria-label="Acciones">
    <button class="util-btn" type="button" onclick="login()">Login</button>
    <button class="util-btn util-btn--danger" type="button" onclick="logout()">Logout</button>
  </nav>

  <main class="login">
    <section class="login-card wait-card" aria-label="Pantalla de espera">
      <h1 id="wait">¡Espera a que haya un juego preparado!</h1>

      <!-- Loader: hamster dentro de la rueda -->
      <div class="wait-loader" aria-hidden="true"></div>
    </section>
  </main>

  <div class="tpl-snow" aria-hidden="true">
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
  </div>

  <script>
    play_next_game();

    function logout(){
      $.ajax({
        url: '../logout/',
        type: 'GET',
        contentType: 'application/json;charset=UTF-8',
        data: {name: sessionStorage.getItem("player_name")},
        success: function(){ window.location.href = "../"; },
        error: function(){ alert("Error al cerrar sesión"); }
      });
    }

    function login(){
      $.ajax({
        url: '../',
        type: 'GET',
        contentType: 'application/json;charset=UTF-8',
        data: {name: sessionStorage.getItem("player_name")},
        success: function(){ window.location.href = "../"; },
        error: function(){ alert("Error al abrir login"); }
      });
    }
  </script>
</body>
</html>
