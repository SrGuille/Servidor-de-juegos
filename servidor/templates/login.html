<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Secret Santa Party</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Advent+Pro:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
</head>

<body class="page-login">
  <main class="login">
    <section class="login-card" aria-label="Acceso al servidor">
      <header class="login-header">
        <h1 class="login-title">Secret Santa Party</h1>
        <p class="login-subtitle">Elige tu nombre y tu nick para entrar a jugar.</p>
      </header>

      <form action="./login_player/" method="GET" class="login-form" onsubmit="register_name()">
        <div class="field">
          <label class="field-label" for="select_players">Nombre</label>
          <select class="form-select-sukki" id="select_players" name="name"></select>
        </div>

        <div class="field">
          <label class="field-label" for="nick">Nombre artístico</label>
          <input class="form-control-sukki" type="text" id="nick" name="nick" maxlength="20" autocomplete="nickname" />
        </div>

        <div class="actions">
          <input class="button-juego" type="submit" value="Jugar" />
        </div>
      </form>
    </section>
  </main>

  <!-- Snow animation -->
  <div class="tpl-snow" aria-hidden="true">
    <!-- puedes dejar 48 divs como tienes; funciona igual. Con 24 también vale -->
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
  </div>
  <!-- End Snow animation -->

  <script>
    $(document).ready(function () {
      get_players_names();
      initSnow();
    });

    // Get all players names and add them to the select
    function get_players_names() {
      $.ajax({
        url: 'get_players_names/',
        type: 'GET',
        data: {},
        contentType: 'application/json;charset=UTF-8',
        success: function (response) {
          add_names_to_select(response.names);
        }
      });
    }

    // Adds server names to the select
    function add_names_to_select(names) {
      let player_name = sessionStorage.getItem("player_name");
      var select = document.getElementById("select_players");

      // Limpia por si recargas o vuelves a entrar
      select.innerHTML = "";

      for (var i = 0; i < names.length; i++) {
        var option = document.createElement("option");
        option.text = names[i];
        option.value = names[i];
        select.add(option);

        if (player_name == null && i === 0) option.selected = true;
        else if (player_name == names[i]) option.selected = true;
      }
    }

    // Called on submit
    function register_name() {
      let name = document.getElementById("select_players").value;
      let nick = document.getElementById("nick").value;
      sessionStorage.setItem("player_name", name);
      sessionStorage.setItem("player_nick", nick);
      sessionStorage.setItem("played", false);
    }

    // Snow (sin 48 reglas nth-child, robusto)
    function initSnow() {
      const flakes = document.querySelectorAll(".tpl-snow > div");
      flakes.forEach((f) => {
        const x = Math.random() * 100;              // vw
        const size = 2 + Math.random() * 6;         // px
        const duration = 7 + Math.random() * 10;    // s
        const delay = -Math.random() * duration;    // s (empieza “ya”)
        const opacity = 0.25 + Math.random() * 0.55;
        const drift = (Math.random() * 40 - 20);    // px

        f.style.setProperty("--x", x + "vw");
        f.style.setProperty("--s", size + "px");
        f.style.setProperty("--d", duration + "s");
        f.style.setProperty("--delay", delay + "s");
        f.style.setProperty("--o", opacity);
        f.style.setProperty("--drift", drift + "px");
      });
    }
  </script>
</body>
</html>
