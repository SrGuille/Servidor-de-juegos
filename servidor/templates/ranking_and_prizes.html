<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Premios</title>

  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>

  <script src="{% static 'js/ranking_and_prizes.js' %}"></script>
  <script src="{% static 'js/game_redirects.js' %}"></script>

  <audio src="{% static 'sounds/sonido_ruleta.mp3' %}" id="spinning_roulette_audio"></audio>
</head>

<body class="page-prizes">
  <main class="prizes">
    <header class="prizes-header">
      <h1 class="titulo-pantalla">Premios</h1>
    </header>

    <section class="prizes-card" aria-label="Ruletas de jugadores y premios">
      <div class="roulette-grid" id="roulettes_container">
        <!-- Jugadores -->
        <div class="roulette-slot">
          <img class="roulette-indicator" src="{% static 'img/indicator.png' %}" alt="Indicador ruleta jugadores">
          <div id="players_roulette_div" class="roulette-stage"></div>
        </div>

        <!-- Premios -->
        <div class="roulette-slot">
          <img class="roulette-indicator" src="{% static 'img/indicator.png' %}" alt="Indicador ruleta premios">
          <div id="prizes_roulette_div" class="roulette-stage"></div>
        </div>
      </div>

      <div class="result-wrap">
        <div id="result" class="result-pill"></div>
      </div>

      <button id="enable_sounds" style="display:none;"></button>
    </section>
  </main>

  <!-- Snow animation -->
  <div class="tpl-snow" aria-hidden="true">
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
  </div>
  <!-- End Snow animation -->
</body>
</html>
