<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ranking</title>

  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>

  <script src="{% static 'js/ranking_and_prizes.js' %}"></script>
  <script src="{% static 'js/game_redirects.js' %}"></script>

  <audio src="{% static 'sounds/sonido_ruleta.mp3' %}" id="spinning_roulette_audio"></audio>
</head>

<body class="page-ranking">
  <main class="ranking">
    <header class="ranking-header">
      <h1 id="title" class="titulo-pantalla">Clasificación</h1>
    </header>

    <section class="rank-card" aria-label="Tabla de clasificación">
      <div id="ranking_container" class="ranking-tables">
        <table class="rank-table" id="ranking-left">
          <thead>
            <tr>
              <th scope="col">Nombre</th>
              <th scope="col">Monedas</th>
            </tr>
          </thead>
          <tbody id="tbody-ranking-left"></tbody>
        </table>

        <table class="rank-table" id="ranking-right">
          <thead>
            <tr>
              <th scope="col">Nombre</th>
              <th scope="col">Monedas</th>
            </tr>
          </thead>
          <tbody id="tbody-ranking-right"></tbody>
        </table>
      </div>
    </section>

    <section class="roulette-card" aria-label="Ruletas">
      <div class="box-roulette" id="roulettes_container">
        <div class="roulette-col">
          <img id="indicador1" class="roulette-indicator" src="{% static 'img/indicator.png' %}" alt="Indicador ruleta jugadores">
          <div id="players_roulette_div"></div>
        </div>

        <div class="roulette-col">
          <img id="indicador2" class="roulette-indicator" src="{% static 'img/indicator.png' %}" alt="Indicador ruleta premios">
          <div id="prizes_roulette_div"></div>
        </div>
      </div>

      <div class="result-wrap">
        <div class="animate__animated animate__fadeIn animate__slow" id="result"></div>
      </div>

      <button id="enable_sounds" style="display:none;"></button>
    </section>
  </main>

  <!-- Snow animation -->
  <div class="tpl-snow" aria-hidden="true">
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (sessionStorage.getItem('special_duel') === 'true') {
        after_special_duel();
      } else {
        get_ranking_and_spin_roulettes();
      }
    });
  </script>
</body>
</html>
