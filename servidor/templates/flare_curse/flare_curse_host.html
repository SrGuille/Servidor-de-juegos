<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flare Curse - Host</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="{% static 'js/game_redirects.js' %}"></script>
    <script src="{% static 'js/flare_curse/flare_curse_host.js' %}?v=20260412-14"></script>
</head>
<body
    class="page-login"
    data-fc-loop-calm="{% static 'sounds/flare_curse/loop_calm.wav' %}"
    data-fc-loop-intense="{% static 'sounds/flare_curse/loop_intense.wav' %}"
    data-fc-voice-base="{% static 'sounds/flare_curse/voices/' %}"
>
    <main class="fc-host-main">
        <section class="fc-host-card">
            <h1 id="host-status">flare curse en curso</h1>
            <div id="host-results" class="fc-host-results" style="display: none;"></div>
        </section>
    </main>

    <style>
        body.page-login {
            margin: 0;
            background: #000;
            color: #fff;
        }

        .fc-host-main {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .fc-host-card {
            background: rgba(0, 0, 0, 0.92);
            border: 2px solid #2e2e2e;
            border-radius: 14px;
            padding: 20px 24px;
            max-width: min(96vw, 1100px);
            width: 100%;
        }

        .fc-host-card h1 {
            margin: 0;
            color: #fff;
            font-size: 36px;
            letter-spacing: 0.02em;
            text-transform: lowercase;
        }

        .fc-host-results {
            margin-top: 14px;
            color: #fff;
            max-height: min(70vh, 760px);
            overflow: auto;
            text-align: left;
        }

        .fc-host-results-columns {
            display: grid;
            grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
            gap: 14px;
            align-items: start;
        }

        .fc-host-results-column {
            min-width: 0;
        }

        .fc-host-results h3 {
            margin: 14px 0 8px;
            color: #f5f5f5;
        }

        .fc-host-summary-line {
            margin: 6px 0;
            line-height: 1.5;
        }

        .fc-host-summary-team-icon {
            display: inline-flex;
            align-items: center;
            margin: 0 8px 0 6px;
            vertical-align: middle;
        }

        .fc-host-summary-team-icon .fc-team-mini {
            width: 20px;
            height: 20px;
            flex: 0 0 20px;
        }

        .fc-host-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .fc-host-table th,
        .fc-host-table td {
            border: 1px solid #323232;
            padding: 6px 8px;
            vertical-align: top;
            color: #f7f7f7;
            background: #080808;
        }

        .fc-host-table th {
            background: #121212;
        }

        .fc-curse-result-chip {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .fc-curse-result-chip.fc-curse-result-hit {
            background: #1e5d2d;
            color: #e8ffe8;
        }

        .fc-curse-result-chip.fc-curse-result-rebound {
            background: #6a2020;
            color: #ffe9e9;
        }

        .fc-player-with-team {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .fc-team-mini {
            width: 18px;
            height: 18px;
            flex: 0 0 18px;
            box-sizing: border-box;
            border: 2px solid #7f7f7f;
            border-radius: 5px;
            background: #151515;
        }

        .fc-team-mini.fc-team-mini-circle {
            border-radius: 999px;
            border-color: #81612c;
            background: #fff3dc;
        }

        .fc-team-mini.fc-team-mini-square {
            border-radius: 4px;
            border-color: #81612c;
            background: #fff3dc;
        }

        .fc-team-mini.fc-team-mini-ghost {
            border-style: dashed;
            border-color: #81612c;
            background: #fff3dc;
        }

        .fc-color-cell {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .fc-color-swatch {
            width: 22px;
            height: 22px;
            display: inline-block;
            border: 2px solid #efefef;
            border-radius: 6px;
            background: var(--fc-color-swatch, #9e9e9e);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.4);
        }

        .fc-color-swatch.fc-color-swatch-unknown {
            border-color: #a6a6a6;
            background: repeating-linear-gradient(
                135deg,
                #7f7f7f 0,
                #7f7f7f 4px,
                #b1b1b1 4px,
                #b1b1b1 8px
            );
        }

    </style>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            init_flare_curse_host();
        });
    </script>
</body>
</html>
