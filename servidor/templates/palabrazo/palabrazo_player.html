    <script src="{% static 'js/palabrazo/palabrazo_player.js' %}"></script>
    <script src="{% static 'js/in_game_room.js' %}"></script>
    <!--Bootstrap 5.1.3-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js" integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body class="page-login" style="top: -50px;">
    <div class="container-fluid d-flex flex-column align-items-center justify-content-start" style="min-height: 100vh; padding-top: 10vh;">
        <div class="w-100 d-flex flex-column align-items-center" style="max-width: 600px;">
            <div class="d-flex w-100 justify-content-center align-items-center" style="gap: 1rem;">
                <input class="form-control text-center" id="respuesta" name="respuesta" style="flex: 1 1 0; min-width: 0; height: 100px; font-size: 2rem; max-width: 70%;" required>
                <input class="button-juego" style="height: 100px; font-size: 2rem; min-width: 120px;" onclick="send_guess(document.getElementById('respuesta').value)" type="submit" value="Enviar">
            </div>
        </div>
    </div>
    <button id="enable_sounds" style="display: none;"></button>
</body>

</script>
</html>
